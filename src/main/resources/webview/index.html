<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src 'none'; connect-src 'none'; font-src 'none'; frame-src 'none'; form-action 'none'; base-uri 'none'">
<style>/*INLINE:chat.css*/</style>
</head>
<body>
<header id="bar">
  <button id="show-changes" class="icon" aria-label="View changes" title="View changes since main, or since the session started"><svg viewBox="0 0 16 16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" d="M3.5 1.5h6l3 3v10h-9zM8 5v4M6 7h4M6 11.5h4"/></svg></button>
  <span id="checkout" hidden></span>
  <span id="status" role="status"></span>
  <span id="usage" hidden tabindex="0" role="meter" aria-valuemin="0" aria-valuemax="100"><span id="usage-ring"></span><span id="usage-pct"></span></span>
  <button id="restart" hidden>Restart</button>
</header>
<dialog id="model-dialog" aria-labelledby="model-dialog-title">
  <h2 id="model-dialog-title">Model</h2>
  <div id="model-options" class="choices" role="group" aria-labelledby="model-dialog-title"></div>
  <section id="effort-section" hidden>
    <h2 id="effort-title">Effort</h2>
    <div id="effort-options" class="segments" role="group" aria-labelledby="effort-title"></div>
  </section>
  <form method="dialog" class="dialog-actions"><button>Done</button></form>
</dialog>
<div id="log-wrap">
  <main id="log"><div id="log-content"></div></main>
  <button id="to-bottom" hidden aria-label="Scroll to the latest" title="Jump to the latest and keep following">↓</button>
</div>
<div id="queue" hidden></div>
<section id="tasks" aria-label="Agents and background processes" hidden></section>
<div id="activity" hidden><span id="activity-dots" class="dots"><span></span><span></span><span></span></span><span id="activity-label" class="label" role="status"></span><span id="activity-secs" class="secs" aria-hidden="true"></span><button id="activity-stop" class="stop" title="Stop the current turn">Stop</button></div>
<div id="attachments" hidden></div>
<footer id="composer">
  <div id="input-box">
    <textarea id="input" rows="3" placeholder="Message (Enter to send, Shift+Enter for a new line)"></textarea>
    <button id="send" aria-label="Send" title="Send (Enter)"><svg viewBox="0 0 16 16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" d="M8 13V3M3.5 7.5 8 3l4.5 4.5"/></svg></button>
  </div>
  <div id="composer-tools">
    <div id="mode-picker" class="picker" hidden>
      <button id="mode" class="composer-tool" title="Permission mode" aria-haspopup="menu" aria-expanded="false" aria-controls="mode-menu" hidden>
        <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" d="M5.5 9V4a1 1 0 0 1 2 0v3.5M7.5 7V2.8a1 1 0 0 1 2 0V7.5M9.5 7.5V3.8a1 1 0 0 1 2 0V10c0 2.6-1.7 4.5-4.2 4.5-1.7 0-2.7-.8-3.5-2L2.3 10a1 1 0 0 1 1.6-1.2L5.5 10.5"/></svg>
        <span id="mode-label"></span>
      </button>
      <div id="mode-menu" class="picker-menu" role="menu" aria-label="Permission mode" hidden></div>
    </div>
    <button id="attach" class="composer-tool" title="Attach images" aria-label="Attach images"><svg viewBox="0 0 16 16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" d="M8 3v10M3 8h10"/></svg></button>
    <div id="composer-choices">
      <div id="agent-picker" class="picker">
        <button id="agent" class="chip" title="Agent for this chat" aria-label="Agent" aria-haspopup="menu" aria-expanded="false" aria-controls="agent-menu" disabled><span id="agent-label">Agent</span></button>
        <div id="agent-menu" class="picker-menu" role="menu" aria-label="Agent" hidden></div>
      </div>
      <button id="model" class="chip" title="Change model and effort" aria-haspopup="dialog" hidden><span id="model-label"></span><span id="effort-label"></span></button>
    </div>
  </div>
</footer>
<div id="tip" role="tooltip" hidden></div>
<script>/*INLINE:marked*/</script>
<script>/*INLINE:purify*/</script>
<script>/*INLINE:text-keys.js*/</script>
<script>/*INLINE:chat.js*/</script>
</body>
</html>
